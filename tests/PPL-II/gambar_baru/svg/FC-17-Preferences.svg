<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:376px;height:1005px;background:#FFFFFF;" width="376px" height="1005px" viewBox="0 0 376 1005" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="20" y="32.995" fill="#000" font-size="14" textLength="334.168" font-weight="700">FC-17: Alur Personalisasi Gaya Jawaban AI</text><text x="35.374" y="49.292" fill="#000" font-size="14" textLength="303.42" font-weight="700">Tab Profil > Personalisasi (client-only)</text></g><ellipse cx="186.084" cy="78.594" rx="10" ry="10" fill="#2F6FED" style="stroke:#222;stroke-width:1;"/><rect x="64.469" y="108.594" width="243.23" height="33.969" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="74.469" y="129.732" fill="#000" font-size="12" textLength="223.23">Pengguna buka Profil > Personalisasi</text><rect x="35.459" y="162.563" width="301.25" height="75.875" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="45.459" y="183.701" fill="#000" font-size="12" textLength="206.625">Tampilkan 7 dropdown preferensi:</text><text x="45.459" y="197.67" fill="#000" font-size="12" textLength="281.25">gaya bahasa, panjang jawaban, judul &amp; daftar,</text><text x="45.459" y="211.639" fill="#000" font-size="12" textLength="202.201">kutipan pasal, contoh penerapan,</text><text x="45.459" y="225.607" fill="#000" font-size="12" textLength="198.188">langkah praktis, bahasa jawaban</text><rect x="82.173" y="258.438" width="207.822" height="33.969" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="92.173" y="279.576" fill="#000" font-size="12" textLength="187.822">Pengguna ubah salah satu opsi</text><rect x="99.279" y="312.406" width="173.609" height="61.906" fi