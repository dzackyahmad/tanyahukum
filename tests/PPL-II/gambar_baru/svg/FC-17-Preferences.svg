 injection)</text><polygon points="118.231,638.125,253.937,638.125,265.937,650.93,253.937,663.734,118.231,663.734,106.231,650.93,118.231,638.125" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="190.084" y="673.945" fill="#000" font-size="11" textLength="13.46">Ya</text><text x="118.231" y="648.335" fill="#000" font-size="11" textLength="135.706">Ada nilai di luar whitelist</text><text x="118.231" y="661.14" fill="#000" font-size="11" textLength="100.799">(mis. teks bebas)?</text><polygon points="186.084,756.074,198.084,768.074,186.084,780.074,174.084,768.074,186.084,756.074" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="52.829" y="800.074" width="266.51" height="75.875" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="62.829" y="821.213" fill="#000" font-size="12" textLength="174.41">buildPreferenceInstructions()</text><text x="62.829" y="835.182" fill="#000" font-size="12" textLength="186.58">→ disisipkan ke system prompt</text><text x="62.829" y="849.15" fill="#000" font-size="12" textLength="246.51">(aturan 1 Keakuratan &amp; aturan 3 Kutipan</text><text x="62.829" y="863.119" fill="#000" font-size="12" textLength="163.066">Sumber tetap wajib diikuti)</text><rect x="55.337" y="895.949" width="261.494" height="47.938" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="65.337" y="917.088" fill="#000" font-size="12" textLength="184.195">Lanjut ke FC-07 (RAG Pipeline)</text><text x="65.337" y="931.057" fill="#000" font-size="12" textLength="241.494">dengan prompt yang sudah disesuaikan</text><ellipse cx="186.084" cy="974.887" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="186.084" cy="974.887" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="186.084" y1="88.594" x2="186.084" y2="108.594" style="stroke:#2F6FED;stroke-widt