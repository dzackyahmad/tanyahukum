00. Termasuk</text><text x="246.011" y="831.231" fill="#000" font-size="13" textLength="316.799">dalam CC=8 bersama operator ?. dan ?? di atas.</text><rect x="60.379" y="788.793" width="159.632" height="45.609" fill="#D5F5E3" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="70.379" y="809.003" fill="#000" font-size="11" textLength="139.632">HTTP 200 {success: true,</text><text x="70.379" y="821.808" fill="#000" font-size="11" textLength="118.309">deletedChats: count}</text><ellipse cx="140.195" cy="870.297" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="140.195" cy="870.297" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="140.195" y1="191.41" x2="140.195" y2="220.105" style="stroke:#2C3E50;stroke-width:1;"/><polygon points="136.195,210.105,140.195,220.105,144.195,210.105,140.195,214.105" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="140.195" y1="134.203" x2="140.195" y2="158.605" style="stroke:#2C3E50;stroke-width:1;"/><polygon points="136.195,148.605,140.195,158.605,144.195,148.605,140.195,152.605" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="223.048" y1="121.398" x2="235.048" y2="121.398" style="stroke:#2C3E50;stroke-width:1;"/><polygon points="231.048,190.105,235.048,200.105,239.048,190.105,235.048,194.105" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="235.048" y1="121.398" x2="235.048" y2="264.105" style="stroke:#2C3E50;stroke-width:1;"/><line x1="235.048" y1="264.105" x2="140.195" y2="264.105" style="stroke:#2C3E50;stroke-width:1;"/><line x1="140.195" y1="264.105" x2="140.195" y2="284.105" style="stroke:#2C3E50;stroke-width:1;"/><polygon points="136.195,274.105,140.195,284.105,144.195,274.105,140.195,278.105" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:1