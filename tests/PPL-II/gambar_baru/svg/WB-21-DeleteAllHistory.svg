<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:598px;height:901px;background:#FFFFFF;" width="598px" height="901px" viewBox="0 0 598 901" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="109.207" y="32.995" fill="#000" font-size="14" textLength="378.396" font-weight="700">WB-21: Control Flow — DELETE /api/chat/history</text><text x="57.069" y="49.292" fill="#000" font-size="14" textLength="482.672" font-weight="700">CC=8 (ESLint) | Hapus semua riwayat chat (konfirmasi wajib)</text></g><ellipse cx="140.195" cy="78.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="65.103" y="158.605" width="150.185" height="32.805" fill="#FADBD8" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="75.103" y="178.816" fill="#000" font-size="11" textLength="130.185">HTTP 401 Unauthorized</text><ellipse cx="140.195" cy="231.105" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="140.195" cy="231.105" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="69.342,108.594,211.048,108.594,223.048,121.398,211.048,134.203,69.342,134.203,57.342,121.398,69.342,108.594" fill="#FDEBD0" style="stroke:#E67E22;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="144.195" y="144.414" fill="#000" font-size="11" textLength="13.46">Ya</text><text x="69.342" y="118.804" fill="#000" font-size="11" textLength="100.359">B1: Tidak ada sesi</text><text x="69.342" y="131.609" fill="#000" font-size="11" textLength="141.706">(session?.userId kosong)?</text><rect x="103.777" y="334.117" width="72.835" height="32.805" fill="#FADBD8" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="113.777" y="354.328" fill="#000" font-size="11" textLength="52.835">HTTP 429</text><ellipse cx="140.195" cy="406.617" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="140.195" cy="406.617" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="58.629,284.105,221.76,284.105,233.76,296.91,221.76,309.715,58.629,309.715,46.629,296.91,58.629,284.105" fill="#FDEBD0" style="stroke:#E67E22;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="144.195" y="319.925" fill="#000" font-size="11" textLength="13.46">Ya</text><text x="58.629" y="294.316" fill="#000" font-size="11" textLength="162.889">B2: rateLimit(userId, 3/menit,</text><text x="58.629" y="307.121" fill="#000" font-size="11" textLength="163.131">"chat-delete-all") terlampaui?</text><rect x="16" y="459.617" width="248.39" height="32.805" fill="#EEF4FF" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="479.828" fill="#000" font-size="11" textLength="228.39">body = await req.json().catch(() => ({}))</text><rect x="63.682" y="560.824" width="153.026" height="45.609" fill="#FADBD8" style="stroke:#2F6FED;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="73.682" y="581.035" fill="#000" font-size="11" textLength="52.835">HTTP 400</text><text x="73.682" y="593.839" fill="#000" font-size="11" textLength="133.026">"Konfirmasi tidak valid."</text><ellipse cx="140.195" cy="640.129" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="140.195" cy="640.129" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><polygon points="48.465,512.422,231.925,512.422,243.925,524.422,231.925,536.422,48.465,536.422,36.465,524.422,48.465,512.422" fill="#FDEBD0" style="stroke:#E67E22;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="144.195" y="546.632" fill="#000" font-size="11" textLength="13.46">Ya</text><text x="48.465" y="528.23" fill="#000" font-size="11" textLength="183.46">B3: body?.confirm !== "HAPUS"?</text><path d="M266.88,683.129