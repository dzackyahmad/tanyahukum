: true</text><text x="434.61" y="498.985" fill="#000" font-size="10" textLength="184.058">OR(title ILIKE, desc ILIKE) jika search</text><text x="434.61" y="510.626" fill="#000" font-size="10" textLength="152.417">category jika bukan "Semua"}</text><polygon points="631.705,631.109,641.705,635.109,631.705,639.109,635.705,635.109" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="427.61" y1="635.109" x2="637.705" y2="635.109" style="stroke:#2C3E50;stroke-width:1;"/><text x="434.61" y="549.267" fill="#000" font-size="10" textLength="62.808">Promise.all([</text><text x="440.968" y="560.907" fill="#000" font-size="10" textLength="104.087">regulation.findMany(</text><text x="447.325" y="572.548" fill="#000" font-size="10" textLength="144.468">{where, skip, take, orderBy}</text><text x="447.325" y="584.188" fill="#000" font-size="10" textLength="141.875">select: id,title,desc,category</text><text x="447.325" y="595.829" fill="#000" font-size="10" textLength="124.277">fileSize,fileUrl,viewCount</text><text x="440.968" y="607.47" fill="#000" font-size="10">)</text><text x="440.968" y="619.11" fill="#000" font-size="10" textLength="133.862">regulation.count({where})</text><text x="434.61" y="630.751" fill="#000" font-size="10" textLength="7.803">])</text><polygon points="438.61,656.75,428.61,660.75,438.61,664.75,434.61,660.75" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="432.61" y1="660.75" x2="642.705" y2="660.75" style="stroke:#2C3E50;stroke-width:1;stroke-dasharray:2,2;"/><text x="444.61" y="656.392" fill="#000" font-size="10" textLength="130.747">[regulations[], totalCount]</text><line x1="427.61" y1="686.391" x2="469.61" y2="686.391" style="stroke:#2C3E50;stroke-width:1;"/><line x1="469.61" y1="686.391" x2="469.61" y2="699.391" style="stroke:#2C3E50;stroke-width:1;"/><line x1="428.61" y1="699.391" x2="469.61" y2="699.391" style="stroke:#2C3E50;stroke-wi